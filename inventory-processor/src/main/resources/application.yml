server.port: ${SERVER_PORT:8081}
spring:
  application.name: inventory-processor
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/opensync}
    username: ${DB_USER:opensync}
    password: ${DB_PASSWORD:opensync}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  flyway.enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener.ack-mode: record
    listener.observation-enabled: true
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
management.endpoints.web.exposure.include: health,info,prometheus,metrics
management.tracing.sampling.probability: ${TRACING_SAMPLE_RATE:1.0}
management.otlp.tracing.endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console: ecs
