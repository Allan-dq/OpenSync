name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Unit tests and Testcontainers end-to-end test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build, unit tests and integration test (PostgreSQL, Kafka, Redis containers)
        run: ./mvnw -B -ntp verify
      - name: The integration test ran (not skipped)
        run: |
          f=integration-tests/target/failsafe-reports/TEST-com.opensync.integration.OpenSyncFlowIT.xml
          test -f "$f"
          grep -o '<testsuite[^>]*>' "$f"
          grep -q 'skipped="0"' "$f" && grep -q 'failures="0"' "$f" && grep -q 'errors="0"' "$f"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: "**/target/*-reports/"
          retention-days: 7

  compose:
    name: Docker Compose stack comes up healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Configure demo secrets
        run: |
          cp .env.example .env
          sed -i 's/^ADMIN_API_KEY=.*/ADMIN_API_KEY=ci-admin-key/; s/^GRAFANA_PASSWORD=.*/GRAFANA_PASSWORD=ci-grafana-password/' .env
      - name: Build and start
        run: docker compose up -d --build
      - name: Services report healthy
        run: |
          for port in 8080 8081 8082 8083; do
            for i in $(seq 1 60); do curl -fsS localhost:$port/actuator/health && break; sleep 5; done
            curl -fsS localhost:$port/actuator/health | grep -q '"status":"UP"' || { echo "service on :$port not UP"; exit 1; }
            echo " <- :$port"
          done
      - name: Logs
        if: always()
        run: docker compose logs --no-color | tail -200
      - name: Tear down
        if: always()
        run: docker compose down -v
