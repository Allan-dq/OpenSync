name: opensync
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: opensync
      POSTGRES_USER: opensync
      POSTGRES_PASSWORD: ${DB_PASSWORD:-opensync}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U opensync"], interval: 5s, timeout: 3s, retries: 20 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }

  kafka:
    image: apache/kafka:3.9.1
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck: { test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list"], interval: 8s, timeout: 5s, retries: 20 }

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on: { kafka: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for topic in inventory.received inventory.validated inventory.updated inventory.published inventory.failed inventory.dead-letter;
        do /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic $$topic --partitions 6 --replication-factor 1;
        done

  partner-gateway:
    build: { context: ., dockerfile: docker/Dockerfile, args: { MODULE: partner-gateway } }
    environment: &service-env
      DB_URL: jdbc:postgresql://postgres:5432/opensync
      DB_USER: opensync
      DB_PASSWORD: ${DB_PASSWORD:-opensync}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_HOST: redis
      ADMIN_API_KEY: ${ADMIN_API_KEY:-change-me}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces
    ports: ["8080:8080"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy }, kafka-init: { condition: service_completed_successfully } }

  inventory-processor:
    build: { context: ., dockerfile: docker/Dockerfile, args: { MODULE: inventory-processor } }
    environment:
      <<: *service-env
      SERVER_PORT: 8081
    ports: ["8081:8081"]
    depends_on: { partner-gateway: { condition: service_started } }

  marketplace-simulator:
    build: { context: ., dockerfile: docker/Dockerfile, args: { MODULE: marketplace-simulator } }
    environment: { SERVER_PORT: 8083 }
    ports: ["8083:8083"]

  marketplace-publisher:
    build: { context: ., dockerfile: docker/Dockerfile, args: { MODULE: marketplace-publisher } }
    environment:
      <<: *service-env
      SERVER_PORT: 8082
      MARKETPLACE_URL: http://marketplace-simulator:8083
    ports: ["8082:8082"]
    depends_on: { partner-gateway: { condition: service_started }, marketplace-simulator: { condition: service_started } }

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    environment: { COLLECTOR_OTLP_ENABLED: "true" }
    ports: ["16686:16686", "4317:4317", "4318:4318"]

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.5.2
    environment: { GF_SECURITY_ADMIN_USER: admin, GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}" }
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  postgres-data:
